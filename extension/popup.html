<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    .url { font-size: 12px; color: #667085; word-break: break-all; }
    .verdict { font-size: 20px; font-weight: 800; margin: 10px 0 4px; }
    .scam { color: #d92d20; } .suspicious { color: #dc8a00; } .safe { color: #12a150; }
    li { font-size: 13px; margin: 4px 0; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #3355ff; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🛡️ ScamShield</h1>
  <div id="url" class="url"></div>
  <div id="verdict" class="verdict">Checking…</div>
  <div id="score" class="url"></div>
  <ul id="reasons"></ul>
  <button id="recheck">Check this page again</button>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
